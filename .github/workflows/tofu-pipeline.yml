name: "⚓ Anchor IaCM - OpenTofu Pipeline"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "stacks/**"
      - "*.tf"
  push:
    branches: [ "main" ]
    paths:
      - "stacks/**"
      - "*.tf"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  TOFU_VERSION: "1.8.2"

jobs:
  # =========================================================================
  # 1. PLAN STAGE: Runs on every Pull Request (Validation & Spec Verification)
  # =========================================================================
  plan:
    name: "OpenTofu Plan"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Execute OpenTofu Plan Across Stacks
        id: plan
        run: |
          set -e
          PLAN_OUTPUT=""
          FOUND_STACKS=0

          # Locate all stack directories containing .tf files
          for stack_dir in $(find stacks -mindepth 1 -maxdepth 1 -type d 2>/dev/null); do
            if ls "${stack_dir}"/*.tf >/dev/null 2>&1; then
              FOUND_STACKS=1
              echo "========================================================="
              echo "🚀 Planning Stack: ${stack_dir}"
              echo "========================================================="

              # Auto-scaffold provider.tf if missing in this stack
              if [ ! -f "${stack_dir}/provider.tf" ] && [ ! -f "${stack_dir}/versions.tf" ]; then
                echo "Creating default provider.tf for ${stack_dir}..."
                cat << 'EOF' > "${stack_dir}/provider.tf"
terraform {
  required_version = ">= 1.6.0"
  required_providers {
    aws = {
      source  = "hashicorp/aws"
      version = "~> 5.0"
    }
  }
}
provider "aws" {
  region = "ap-south-1"
}
EOF
              fi

              pushd "${stack_dir}" > /dev/null
              
              tofu init -no-color
              tofu validate -no-color
              
              # Lockless plan prevents CI pipeline deadlocks
              STACK_PLAN=$(tofu plan -lock=false -no-color)
              echo "${STACK_PLAN}"
              
              PLAN_OUTPUT+=$'\n\n'"### 📦 Stack: \`${stack_dir}\`"$'\n'"\`\`\`hcl"$'\n'"${STACK_PLAN}"$'\n'"\`\`\`"
              popd > /dev/null
            fi
          done

          if [ "$FOUND_STACKS" -eq 0 ]; then
            echo "::warning ::No stack configurations found under stacks/. Checking root directory."
            if ls *.tf >/dev/null 2>&1; then
              tofu init -no-color
              tofu plan -lock=false -no-color
            fi
          fi

          # Export truncated summary for PR comment
          echo "SUMMARY<<EOF" >> $GITHUB_ENV
          echo "${PLAN_OUTPUT:0:60000}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Plan Comment to PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = process.env.SUMMARY || 'Plan succeeded with no changes.';
            const body = `### ⚓ Anchor IaCM - Automated OpenTofu Plan
            
            **AWS Region:** \`${process.env.AWS_REGION}\`
            **Triggered By:** @${context.actor}
            
            <details>
            <summary>Click to expand OpenTofu Plan Diff</summary>
            
            ${summary}
            
            </details>
            
            *Plan generated by Anchor IaCM automated delivery pipeline.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # =========================================================================
  # 2. APPLY STAGE: Runs when PR is Merged into Main (Adopts Live Resources)
  # =========================================================================
  apply:
    name: "OpenTofu Apply"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Apply All Stacks
        run: |
          set -e
          for stack_dir in $(find stacks -mindepth 1 -maxdepth 1 -type d 2>/dev/null); do
            if ls "${stack_dir}"/*.tf >/dev/null 2>&1; then
              echo "========================================================="
              echo "🚀 Applying Stack: ${stack_dir}"
              echo "========================================================="

              # Auto-scaffold provider.tf if missing
              if [ ! -f "${stack_dir}/provider.tf" ] && [ ! -f "${stack_dir}/versions.tf" ]; then
                cat << 'EOF' > "${stack_dir}/provider.tf"
terraform {
  required_version = ">= 1.6.0"
  required_providers {
    aws = {
      source  = "hashicorp/aws"
      version = "~> 5.0"
    }
  }
}
provider "aws" {
  region = "ap-south-1"
}
EOF
              fi

              pushd "${stack_dir}" > /dev/null
              tofu init -no-color
              tofu apply -auto-approve -no-color
              popd > /dev/null
            fi
          done
