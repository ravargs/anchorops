name: "Anchor IaCM - OpenTofu Pipeline"

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "stacks/**"
      - "*.tf"
  push:
    branches: [ "main" ]
    paths:
      - "stacks/**"
      - "*.tf"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  TOFU_VERSION: "1.8.2"

jobs:
  # =========================================================================
  # 1. PLAN STAGE: Validates and plans all stacks on Pull Request
  # =========================================================================
  plan:
    name: "OpenTofu Plan"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Execute OpenTofu Plan Across Stacks
        run: |
          set -e
          FOUND_STACKS=0

          for stack_dir in $(find stacks -mindepth 1 -maxdepth 1 -type d 2>/dev/null); do
            if ls "${stack_dir}"/*.tf >/dev/null 2>&1; then
              FOUND_STACKS=1
              echo "========================================================="
              echo "🚀 Planning Stack: ${stack_dir}"
              echo "========================================================="
              (
                cd "${stack_dir}"
                if [ ! -f "provider.tf" ] && [ ! -f "versions.tf" ]; then
                  echo 'terraform { required_version = ">= 1.6.0"; required_providers { aws = { source = "hashicorp/aws"; version = "~> 5.0" } } } provider "aws" { region = "ap-south-1" }' > provider.tf
                fi
                tofu init -no-color
                tofu validate -no-color
                tofu plan -lock=false -no-color
              )
            fi
          done

          if [ "$FOUND_STACKS" -eq 0 ]; then
            echo "No stack directories found under stacks/. Checking repository root."
            if ls *.tf >/dev/null 2>&1; then
              tofu init -no-color
              tofu plan -lock=false -no-color
            fi
          fi

  # =========================================================================
  # 2. APPLY STAGE: Adopts & reconciles resources when PR is merged to main
  # =========================================================================
  apply:
    name: "OpenTofu Apply"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infrastructure Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: Execute OpenTofu Apply Across Stacks
        run: |
          set -e
          for stack_dir in $(find stacks -mindepth 1 -maxdepth 1 -type d 2>/dev/null); do
            if ls "${stack_dir}"/*.tf >/dev/null 2>&1; then
              echo "========================================================="
              echo "🚀 Applying Stack: ${stack_dir}"
              echo "========================================================="
              (
                cd "${stack_dir}"
                if [ ! -f "provider.tf" ] && [ ! -f "versions.tf" ]; then
                  echo 'terraform { required_version = ">= 1.6.0"; required_providers { aws = { source = "hashicorp/aws"; version = "~> 5.0" } } } provider "aws" { region = "ap-south-1" }' > provider.tf
                fi
                tofu init -no-color
                tofu apply -auto-approve -no-color
              )
            fi
          done
